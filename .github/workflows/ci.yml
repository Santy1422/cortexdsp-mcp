name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block accidental secrets
        run: |
          # Fail if anything that looks like a real key/token/connection string lands in the repo.
          if grep -rnEi \
            -e 'cortex_mcp_[a-z0-9]{16}' \
            -e 'mongodb(\+srv)?://[^ ]+' \
            -e 'sk-[a-z0-9]{20}' \
            -e '(api[_-]?key|secret|password|token)[\"'\'' ]*[:=][\"'\'' ]*[A-Za-z0-9]{20}' \
            --include='*.js' --include='*.json' --include='*.md' --include='*.yml' \
            --exclude-dir=node_modules . ; then
            echo "::error::Possible secret committed — remove it."
            exit 1
          fi
          echo "No secrets detected."
